name: Beatbox fuer RG35XX bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ARM-Runner: Der MinUI-Toolchain-Container ist ein arm64-Image
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain pruefen (nur zur Diagnose)
        run: |
          docker run --rm savant/minui-toolchain:rg35xx /bin/bash -c '
            ls /opt; echo "---"; ls /opt/*/usr/bin 2>/dev/null | head -20; echo "---";
            ls /opt/*/usr/arm-buildroot-linux-gnueabihf/sysroot/usr/bin 2>/dev/null | grep -i sdl;
            echo "CROSS_COMPILE=$CROSS_COMPILE PREFIX=$PREFIX"' || true

      - name: Beatbox bauen
        run: |
          docker run --rm -v "$PWD":/root/workspace/beatbox savant/minui-toolchain:rg35xx \
            /bin/bash -c "cd /root/workspace/beatbox && make pak"

      - name: Ergebnis pruefen
        run: |
          file dist/Beatbox.pak/beatbox
          ls -l dist/Beatbox.pak

      - uses: actions/upload-artifact@v4
        with:
          name: Beatbox-pak
          path: dist
